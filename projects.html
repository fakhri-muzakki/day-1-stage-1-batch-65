<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add My Project</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body class="bg-body-tertiary">
    <header class="mb-4">
      <nav class="navbar navbar-expand-sm bg-dark">
        <div class="container">
          <a class="navbar-brand text-light" href="/">
            <img src="/assets/images//logo.png" alt="logo" width="50" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active text-light"
                  aria-current="page"
                  href="/"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-light" href="projects.html"
                  >My project</a
                >
              </li>
            </ul>

            <a href="/contact.html" class="btn btn-success fw-medium">
              Contact
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main
      class="container d-flex flex-column justify-content-center align-items-center p-5 gap-5"
    >
      <!-- Form section -->
      <section class="card w-100" style="max-width: 520px">
        <div class="card-body">
          <h3 class="text-center mb-4 text-dark">Add My Project</h3>

          <form id="projectForm" method="post">
            <!-- Project Name -->
            <div class="mb-3">
              <label class="form-label text-dark fw-medium">Project Name</label>
              <input
                type="text"
                name="projectName"
                required
                id="projectName"
                class="form-control"
                placeholder="Enter project name"
              />
            </div>

            <!-- Dates -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark fw-medium">Start Date</label>
                <input
                  type="date"
                  name="startDate"
                  required
                  id="startDate"
                  class="form-control"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark fw-medium">End Date</label>
                <input
                  type="date"
                  name="endDate"
                  required
                  id="endDate"
                  class="form-control"
                />
              </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label text-dark fw-medium">Description</label>
              <textarea
                class="form-control"
                rows="4"
                name="description"
                required
                id="description"
                placeholder="Describe your project"
              ></textarea>
            </div>

            <!-- Technologies -->
            <div class="mb-3">
              <label class="form-label text-dark fw-medium d-block"
                >Technologies</label
              >

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="nextjs"
                  name="technologies"
                  value="next js"
                />
                <label class="form-check-label text-dark" for="nextjs">
                  Next JS
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="typescript"
                  name="technologies"
                  value="typescript"
                />
                <label class="form-check-label text-dark" for="typescript">
                  TypeScript
                </label>
              </div>
            </div>

            <!-- Image -->
            <div class="mb-4">
              <label class="form-label text-dark fw-medium">Upload Image</label>
              <input
                type="file"
                name="image"
                required
                id="image"
                class="form-control mb-2"
              />
              <div class="mb-3">
                <img
                  id="imagePreview"
                  class="img-fluid rounded d-none"
                  alt="Preview Image"
                />
              </div>
              <small class="form-text text-muted">
                Accepted formats: .jpg, .jpeg, .png (Max 2MB)
              </small>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100 fw-medium">
              Submit Project
            </button>
          </form>
        </div>
      </section>

      <!-- project section -->
      <section class="container">
        <h2 class="text-center mb-5">My Project</h2>

        <div class="dropdown text-end mb-4">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Filter By Last Time
          </button>
          <ul class="dropdown-menu" id="filterByLastTimeMenu">
            <li>
              <button class="dropdown-item" data-filter="1">
                Last 1 minutes
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-filter="5">
                Last 5 minutes
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-filter="10">
                Last 10 minutes
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-filter="30">
                Last 30 minutes
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-filter="60">
                Last 60 minutes
              </button>
            </li>
          </ul>
        </div>

        <div class="row g-4" id="projects">
          <div
            id="emptyProject"
            class="text-center text-secondary py-5 bg-white shadow-lg mx-auto"
            style="max-width: 520px"
          >
            <i class="bi bi-folder-x display-4 mb-3"></i>
            <h5 class="text-white">No Project Found</h5>
            <p class="mb-0">You haven’t added any project yet.</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/scripts/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
